name: Update Algorithm Grass

on:
  workflow_run:
    workflows:
      - "Batch merge all PRs"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-algorithm-grass
  cancel-in-progress: false

jobs:
  update-grass:
    if: >
      github.repository == 'Chwippo-Eleven/ALGO' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate algorithm grass
        run: |
          python .github/scripts/update_grass.py

      - name: Commit grass SVG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/algorithm-grass.svg

          if git diff --cached --quiet; then
            echo "잔디 변경 사항이 없습니다."
            exit 0
          fi

          git commit -m "chore: 알고리즘 잔디 업데이트 [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
