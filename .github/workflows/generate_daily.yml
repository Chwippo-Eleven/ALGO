name: Generate daily problem folders

on:
  push:
    branches:
      - main
    paths:
      - README.md

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate date, check duplicates and generate daily problem folders
        env:
          TZ: Asia/Seoul
        run: python .github/scripts/generate_daily.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- problem_solve

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "chore: generate daily problems and update history [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
