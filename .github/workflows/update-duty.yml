name: Update Problem Duty

on:
  schedule:
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-problem-duty
  cancel-in-progress: false

jobs:
  update-duty:
    if: github.repository == 'Chwippo-Eleven/ALGO'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate problem duty SVG
        run: |
          python .github/scripts/update_duty.py

      - name: Commit duty SVG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/problem-duty.svg

          if git diff --cached --quiet; then
            echo "담당자 SVG 변경 사항이 없습니다."
            exit 0
          fi

          git commit -m "chore: 문제 출제 담당자 SVG 업데이트 [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
